[package]
name = "tetris-ml"
version = "0.1.0"
edition = "2024"
authors = ["Alex Comerford <alex@taoa.io>"]
publish = false
description = "ML building blocks for Tetris: modules, optimizers, tensors, data generation"

[lib]
name = "tetris_ml"
path = "src/lib.rs"

[features]
default = []
candle-cuda = ["candle-core/cuda", "candle-nn/cuda"]
candle-metal = ["candle-core/metal", "candle-nn/metal"]
never-inline = []

# Float dtype selection - choose exactly one
dtype-f16 = []
dtype-bf16 = []
dtype-f32 = []
dtype-f64 = []

[dependencies]
# Internal crates
tetris-game.workspace = true
tetris-search.workspace = true
proc-macros.workspace = true

# Core
anyhow.workspace = true
rand.workspace = true

# Logging
tracing.workspace = true

# Parallelism
rayon.workspace = true
crossbeam.workspace = true

# Serialization
serde.workspace = true

# ML
candle-core.workspace = true
candle-nn.workspace = true

# Utilities
image.workspace = true

# TUI (for tetris_tui module)
ratatui.workspace = true
crossterm.workspace = true

[lints]
workspace = true
