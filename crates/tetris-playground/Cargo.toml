[package]
name = "tetris-playground"
version = "0.1.0"
edition = "2024"
authors = ["Alex Comerford <alex@taoa.io>"]
publish = false
description = "Demos, experiments, and reference implementations for Tetris atlas"

[lib]
name = "tetris_playground"
path = "src/lib.rs"

# Binaries are grouped under src/bin/<category>/ and listed explicitly so
# archived files outside src/bin are never built as Cargo targets.

[[bin]]
name = "tetris_demo_single"
path = "src/bin/examples/tetris_demo_single.rs"

[[bin]]
name = "tetris_demo_multi"
path = "src/bin/examples/tetris_demo_multi.rs"

[[bin]]
name = "tetris_demo_adaptive_multi"
path = "src/bin/examples/tetris_demo_adaptive_multi.rs"

[[bin]]
name = "tetris_five_bag_empty"
path = "src/bin/examples/tetris_five_bag_empty.rs"

[[bin]]
name = "tetris_five_bag_bench"
path = "src/bin/examples/tetris_five_bag_bench.rs"

[[bin]]
name = "tetris_atlas_inmemory"
path = "src/bin/atlas/tetris_atlas_inmemory.rs"

[[bin]]
name = "tetris_atlas_rocksdb"
path = "src/bin/atlas/tetris_atlas_rocksdb.rs"

[[bin]]
name = "tetris_atlas_bagstate"
path = "src/bin/atlas/tetris_atlas_bagstate.rs"

[[bin]]
name = "tetris_cli"
path = "src/bin/tools/tetris_cli.rs"

[[bin]]
name = "tetris_train_beam_supervised"
path = "src/bin/training/tetris_train_beam_supervised.rs"

[[bin]]
name = "tetris_train_genetic"
path = "src/bin/training/tetris_train_genetic.rs"

[[bin]]
name = "tetris_invariant_synthesis"
path = "src/bin/research/tetris_invariant_synthesis/main.rs"

[[bin]]
name = "tetris_safe_set"
path = "src/bin/research/tetris_safe_set/main.rs"

[[bin]]
name = "tetris_mcgs"
path = "src/bin/research/tetris_mcgs/main.rs"

[[bin]]
name = "tetris_success_set_solver"
path = "src/bin/research/tetris_success_set_solver/main.rs"

[[bin]]
name = "tetris_fixed_bag_atlas"
path = "src/bin/research/tetris_fixed_bag_atlas/main.rs"

[[bin]]
name = "tetris_7bag_atlas"
path = "src/bin/research/tetris_7bag_atlas/main.rs"

[[bin]]
name = "tetris_bag_cycle_solver"
path = "src/bin/research/tetris_bag_cycle_solver/main.rs"

[[bin]]
name = "tetris_invariant_smt"
path = "src/bin/research/tetris_invariant_smt/main.rs"

[[bin]]
name = "tetris_nbag_solver"
path = "src/bin/research/tetris_nbag_solver/main.rs"

[[bin]]
name = "tetris_bag_checkpoint"
path = "src/bin/research/tetris_bag_checkpoint/main.rs"

[[bin]]
name = "tetris_five_bag_chain"
path = "src/bin/research/tetris_five_bag_chain/main.rs"

[[bin]]
name = "tetris_cycle_atlas"
path = "src/bin/research/tetris_cycle_atlas/main.rs"

[[bin]]
name = "tetris_state_trajectory"
path = "src/bin/visualizations/state_trajectory/main.rs"

[[bin]]
name = "tetris_phase_atlas"
path = "src/bin/research/tetris_phase_atlas/main.rs"

[[bin]]
name = "tetris_carrier_probe"
path = "src/bin/research/tetris_carrier_probe/main.rs"

[[bin]]
name = "tetris_eigen"
path = "src/bin/research/tetris_eigen/main.rs"

[[bin]]
name = "tetris_energy"
path = "src/bin/research/tetris_energy/main.rs"

[[bin]]
name = "tetris_lean_funnel"
path = "src/bin/research/tetris_lean_funnel/main.rs"

[[bin]]
name = "tetris_maxplus_cert"
path = "src/bin/research/tetris_maxplus_cert/main.rs"

[[bin]]
name = "tetris_policy"
path = "src/bin/research/tetris_policy/main.rs"

[[bin]]
name = "tetris_preview"
path = "src/bin/research/tetris_preview/main.rs"

[[bin]]
name = "tetris_szt3"
path = "src/bin/research/tetris_szt3/main.rs"

[[bin]]
name = "tetris_tropical"
path = "src/bin/research/tetris_tropical/main.rs"

[features]
default = []
candle-cuda = ["candle-core/cuda", "candle-nn/cuda"]
candle-metal = ["candle-core/metal", "candle-nn/metal"]
never-inline = []

# Float dtype selection - choose exactly one
dtype-f16 = []
dtype-bf16 = []
dtype-f32 = []
dtype-f64 = []

[dependencies]
# Internal crates
tetris-game.workspace = true
tetris-utils.workspace = true
tetris-search.workspace = true
tetris-ml.workspace = true
proc-macros.workspace = true
tensorboard.workspace = true

# CLI
clap = { version = "4.5.28", features = ["derive"] }
ctrlc = "3.4"

# Core
anyhow.workspace = true
rand.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting"] }

# Hashing
rustc-hash = "2.1"

# Parallelism & concurrency
rayon.workspace = true
crossbeam.workspace = true
crossbeam-queue = "0.3.12"
crossbeam-channel = "0.5.15"
crossbeam-skiplist = "0.1.3"
dashmap = "6.1.0"
num_cpus.workspace = true

# Storage backends
rocksdb = { version = "0.22.0", features = ["multi-threaded-cf"] }
heed = "0.22.0"
feoxdb = "0.5.0"
rusqlite = { version = "0.35", features = ["bundled"] }

# Serialization
bincode = "1.3.3"
serde.workspace = true
serde_json = "1.0.145"
serde_yaml = "0.9.34"
prost.workspace = true
prost-types.workspace = true

# ML
candle-core.workspace = true
candle-nn.workspace = true

# TUI
ratatui.workspace = true
crossterm.workspace = true

# Utilities
itertools = "0.14.0"
ruint = "1.15.0"
gethostname.workspace = true
image.workspace = true
ulid = "1.2.1"
tokio = { version = "1.42.0", features = ["full"] }
backoff = "0.4.0"

# SMT solving
z3 = "0.20"
z3-sys = "0.11"
good_lp = { version = "1.15.2", default-features = false, features = ["clarabel"] }

[lints]
workspace = true
