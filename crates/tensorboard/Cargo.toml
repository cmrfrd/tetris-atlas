[package]
name = "tensorboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
prost.workspace = true
prost-types.workspace = true
image.workspace = true
gethostname.workspace = true
crc32fast = "1.4.2"

[features]
# Regenerate the protobuf bindings from .proto sources via prost-build.
# Off by default: clean builds compile the checked-in bindings in
# src/tensorboard_generated/ and never pull in the prost-build toolchain.
regen-protos = ["dep:prost-build"]

[build-dependencies]
prost-build = { version = "0.13", optional = true }

[lib]
name = "tensorboard"
path = "src/lib.rs"
doctest = false
