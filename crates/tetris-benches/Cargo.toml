[package]
name = "tetris-benches"
version = "0.1.0"
edition = "2024"
authors = ["Alex Comerford <alex@taoa.io>"]
publish = false

[lib]
bench = false

[[bench]]
name = "benches"
path = "src/criterion.rs"
harness = false

[features]
default = []
apple-silicon = ["tetris-search/apple-silicon"]

[dependencies]
tetris-game.workspace = true
inventory = "0.3.25"
rand.workspace = true
tetris-codec.workspace = true
tetris-search.workspace = true
tetris-utils.workspace = true
criterion = { version = "0.5.1", features = ["html_reports"] }

[dev-dependencies]
pprof = { version = "0.15.0", features = [
    "flamegraph",
    "criterion",
    "prost-codec",
] }

[lints]
workspace = true
