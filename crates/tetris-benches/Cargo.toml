[package]
name = "tetris-benches"
version = "0.1.0"
edition = "2024"
authors = ["Alex Comerford <alex@taoa.io>"]
publish = false

[lib]
name = "tetris_benches"
path = "src/lib.rs"

[[bench]]
name = "benches"
harness = false

[features]
default = []
apple-silicon = ["tetris-search/apple-silicon"]

[dependencies]
tetris-game.workspace = true
tetris-search.workspace = true
tetris-utils.workspace = true
rand.workspace = true
inventory = "0.3.25"
criterion = { version = "0.5.1", features = ["html_reports"] }
pprof = { version = "0.15.0", features = [
    "flamegraph",
    "criterion",
    "prost-codec",
] }

[lints]
workspace = true
