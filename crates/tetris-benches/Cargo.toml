[package]
name = "tetris-benches"
version = "0.1.0"
edition = "2024"
authors = ["Alex Comerford <alex@taoa.io>"]
publish = false

[lib]
bench = false

[[bin]]
name = "codec_sweep"
path = "src/bin/codec_sweep.rs"
bench = false

[[bench]]
name = "benches"
path = "src/criterion.rs"
harness = false

[features]
default = []
never-inline = ["tetris-codec/never-inline"]
apple-silicon = ["tetris-search/apple-silicon"]

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde.workspace = true
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3.27.0"
tetris-game.workspace = true
inventory = "0.3.25"
rand.workspace = true
tetris-codec.workspace = true
tetris-search.workspace = true
tetris-utils.workspace = true
criterion = { version = "0.5.1", features = ["html_reports"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[dev-dependencies]
pprof = { version = "0.15.0", features = [
    "flamegraph",
    "criterion",
    "prost-codec",
] }

[lints]
workspace = true
