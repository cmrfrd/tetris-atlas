[workspace]
members = [
    "crates/*",
]
resolver = "2"
[profile.bench]
debug = true
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = true
lto = "fat"
codegen-units = 1
opt-level = 3

[workspace.dependencies]
# Internal crates
proc-macros = { path = "crates/proc-macros" }
tetris-utils = { path = "crates/tetris-utils" }
tetris-game = { path = "crates/tetris-game" }
tetris-search = { path = "crates/tetris-search" }
tetris-ml = { path = "crates/tetris-ml" }
tensorboard = { path = "crates/tensorboard" }

# Core
rand = { version = "0.9.2", features = ["small_rng"] }
anyhow = "1.0.95"

# Logging
tracing = "0.1.41"

# Parallelism
rayon = "1.10.0"
crossbeam = "0.8.4"
num_cpus = "1.17.0"

# Serialization
serde = { version = "1.0.226", features = ["derive"] }
prost = "0.13"
prost-types = "0.13"

# ML
candle-core = "0.9.2-alpha.2"
candle-nn = "0.9.2-alpha.2"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Utilities
# PNG-only: tensorboard encodes PNG summaries, tetris-ml builds RgbImage in
# memory. Dropping default features avoids compiling jpeg/gif/webp/tiff/bmp codecs.
image = { version = "0.25.8", default-features = false, features = ["png"] }
gethostname = "1.0.2"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_pass_by_value = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"
similar_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
redundant_closure = "allow"
needless_borrow = "allow"
option_map_unit_fn = "allow"
semicolon_if_nothing_returned = "allow"
uninlined_format_args = "allow"
unnecessary_cast = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
inline_always = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
type_repetition_in_bounds = "allow"
elidable_lifetime_names = "allow"
use_self = "allow"
new_without_default = "allow"
uninit_assumed_init = "allow"
iter_without_into_iter = "allow"
ptr_arg = "allow"
ptr_as_ptr = "allow"
redundant_clone = "allow"
clone_on_copy = "allow"
collapsible_if = "allow"
expect_used = "allow"
flat_map_identity = "allow"
get_first = "allow"
let_and_return = "allow"
manual_clamp = "allow"
manual_is_multiple_of = "allow"
manual_repeat_n = "allow"
manual_div_ceil = "allow"
missing_const_for_thread_local = "allow"
needless_question_mark = "allow"
needless_range_loop = "allow"
out_of_bounds_indexing = "allow"
redundant_locals = "allow"
unwrap_used = "allow"
useless_conversion = "allow"
useless_vec = "allow"
wrong_self_convention = "allow"
approx_constant = "allow"

panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[workspace.lints.rust]
unused_variables = "allow"
dead_code = "allow"
unused_mut = "allow"
unused_assignments = "allow"
unused_imports = "allow"
unused_parens = "allow"
private_interfaces = "allow"
