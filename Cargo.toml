[workspace]
members = ["crates/*"]
resolver = "2"

[profile.bench]
debug = true
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.release]
debug = true
lto = "fat"
codegen-units = 1
opt-level = 3

[workspace.dependencies]
# Internal crates
proc-macros = { path = "crates/proc-macros" }
tetris-utils = { path = "crates/tetris-utils" }
tetris-game = { path = "crates/tetris-game" }
tetris-search = { path = "crates/tetris-search" }
tetris-ml = { path = "crates/tetris-ml" }
tensorboard = { path = "crates/tensorboard" }

# Core
rand = { version = "0.10.3" }
anyhow = "1.0.104"

# Logging
tracing = "0.1.44"

# Parallelism
rayon = "1.12.0"
crossbeam = "0.8.5"
num_cpus = "1.17.0"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
prost = "0.14.4"
prost-types = "0.14.4"

# ML
candle-core = "0.10.2"
candle-nn = "0.10.2"

# TUI
ratatui = "0.30.2"
crossterm = "0.29.0"

# Utilities
# PNG-only: tensorboard encodes PNG summaries, tetris-ml builds RgbImage in
# memory. Dropping default features avoids compiling jpeg/gif/webp/tiff/bmp codecs.
image = { version = "0.25.10", default-features = false, features = ["png"] }
gethostname = "1.1.0"

# Members must opt in with `[lints] workspace = true`.
# Give broad groups lower priority so individual rules take precedence.
# Shared Clippy behavior options, including test exceptions, live in clippy.toml.
[workspace.lints.rust]
# The pinned nightly is required for generic_const_exprs.
incomplete_features = "allow"
unused = { level = "warn", priority = -1 }
dead_code = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"
invalid_value = "deny"
private_interfaces = "warn"
unfulfilled_lint_expectations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Unsafe APIs document their caller contract; inline safety comments are optional.
missing_safety_doc = "deny"

# Do not ship unfinished implementation paths.
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Panic-style failures must identify the failed operation or invariant.
unwrap_used = "deny"
expect_used = "allow"
let_underscore_must_use = "warn"

# Board encodings, counters, and tensor conversions need explicit range reasoning.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"

allow_attributes_without_reason = "warn"

# Const-generic kernels and research entry points legitimately use these patterns.
too_many_arguments = "allow"
inline_always = "allow"
needless_return = "allow"
