name = "proofs"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Proofs"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

# Green standard library: builds only modules transitively imported from
# `Proofs.lean`. Kept sorry-free and native_decide-free (base axioms only).
[[lean_lib]]
name = "Proofs"

# Research routes (active + floored). Manual target: `lake build ProofsExperiments`.
# May use native_decide / large scaffolds; never imported by `Proofs`.
[[lean_lib]]
name = "ProofsExperiments"

# Design-time carrier search harness (no mathlib imports — compiles native, fast).
# Manual: `lake exe carriersearch`. Not part of any proof target.
[[lean_exe]]
name = "carriersearch"
root = "Search.CarrierSearch"
